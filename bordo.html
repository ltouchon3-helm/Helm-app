<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Helm · controle de gastos</title>
<style>
  :root{
    --ink:#182A29; --cream:#F6F3EC; --teal:#1B7A72; --coral:#C1553D;
    --slate:#6E7B79; --line:#E4DFD1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:'Iowan Old Style','Georgia',ui-serif,serif;
    -webkit-tap-highlight-color:transparent;
  }
  .sans{ font-family:-apple-system,system-ui,sans-serif; }
  #app{ max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:100px; position:relative; }

  /* ---- login ---- */
  #login-screen, #banks-screen{
    max-width:340px; margin:18vh auto 0; padding:0 24px; text-align:center;
  }
  #invest-onboard-screen{
    max-width:420px; margin:8vh auto 0; text-align:center;
  }
  #login-screen h1, #banks-screen h1, #invest-onboard-screen h1{ font-size:22px; margin-bottom:2px; }
  #login-screen p.sub, #banks-screen p.sub, #invest-onboard-screen p.sub{ font-size:11px; color:var(--slate); text-transform:uppercase; letter-spacing:.6px; margin-top:0; margin-bottom:28px; }
  #login-screen input{
    width:100%; padding:12px 14px; margin-bottom:10px; border-radius:9px; border:1px solid var(--line);
    font-size:15px; background:#fff; font-family:inherit;
  }
  #login-screen button, #banks-screen button, #invest-onboard-screen button{
    width:100%; padding:13px 0; border-radius:10px; border:none; background:var(--ink);
    color:#fff; font-size:14.5px; font-weight:700; cursor:pointer; margin-top:6px; font-family:inherit;
  }
  #login-error{ color:var(--coral); font-size:12.5px; margin-top:10px; min-height:16px; font-family:inherit; }
  #banks-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; text-align:left; }
  .bank-row{
    display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; font-size:14.5px; cursor:pointer;
  }
  .bank-row input{ width:17px; height:17px; }

  /* ---- header / nav ---- */
  header{ display:flex; justify-content:space-between; align-items:center; padding:20px 18px 10px; }
  .brand{ display:flex; align-items:center; gap:8px; }
  .brand-title{ font-size:19px; font-weight:700; }
  .brand-sub{ font-size:10.5px; color:var(--slate); text-transform:uppercase; letter-spacing:.6px; margin-top:-1px; }
  #logout-btn{ background:none; border:none; font-size:10.5px; color:var(--slate); cursor:pointer; font-family:inherit; text-decoration:underline; }

  .month-nav{ display:flex; align-items:center; justify-content:center; gap:18px; padding:6px 0 14px; }
  .month-arrow{ width:30px; height:30px; border-radius:999px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:16px; }
  .month-label{ font-size:16px; font-weight:700; min-width:84px; text-align:center; text-transform:capitalize; }

  .tabs{ display:flex; gap:4px; margin:0 16px 14px; background:#EAE5D8; border-radius:10px; padding:3px; overflow-x:auto; }
  .tab-btn{
    flex:0 0 auto; border:none; background:transparent; padding:8px 11px; font-size:12.5px; font-weight:600;
    color:var(--slate); border-radius:8px; cursor:pointer; white-space:nowrap; font-family:inherit;
  }
  .tab-btn.active{ background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .tab-badge{ display:inline-block; margin-left:5px; background:var(--coral); color:#fff; border-radius:999px; font-size:10px; font-weight:700; padding:1px 6px; }

  main{ padding:0 16px; display:flex; flex-direction:column; gap:14px; }

  .cards-row{ display:flex; gap:10px; }
  .stat-card{ flex:1; background:#fff; border-radius:12px; padding:12px 14px; border-left:3px solid var(--teal); }
  .stat-card.coral{ border-color:var(--coral); }
  .stat-label{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--slate); font-weight:600; text-transform:uppercase; letter-spacing:.4px; margin-bottom:4px; }
  .stat-value{ font-size:18px; font-weight:700; }

  .balance-card{ border-radius:14px; padding:16px 18px; color:#fff; }
  .balance-label{ font-size:11.5px; opacity:.85; text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
  .balance-value{ font-size:26px; font-weight:700; }

  .panel{ background:#fff; border-radius:14px; padding:14px 14px 16px; }
  .panel-title{ font-size:14px; font-weight:700; margin-bottom:10px; }

  .cat-row{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:3px; }
  .cat-bar-bg{ height:5px; background:#EEE9DC; border-radius:999px; margin-bottom:9px; }
  .cat-bar-fill{ height:100%; background:var(--teal); border-radius:999px; }

  .entry-row{ display:flex; align-items:center; gap:10px; background:#fff; border-radius:12px; padding:10px 12px; }
  .entry-dot{ width:22px; height:22px; border-radius:999px; flex-shrink:0; background:var(--slate); }
  .entry-desc{ font-size:14px; font-weight:700; }
  .entry-meta{ font-size:11px; color:var(--slate); margin-top:1px; text-transform:capitalize; }
  .entry-value{ font-size:14px; font-weight:700; white-space:nowrap; }
  .delete-btn{ border:none; background:transparent; cursor:pointer; font-size:15px; color:var(--slate); padding:4px; }

  .empty{ display:flex; flex-direction:column; align-items:center; padding:50px 20px; text-align:center; }
  .empty-text{ font-size:13px; color:var(--slate); max-width:220px; }

  .fab{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); width:56px; height:56px;
    border-radius:999px; background:var(--ink); border:none; color:#fff; font-size:26px; cursor:pointer;
    box-shadow:0 6px 18px rgba(24,42,41,.35); max-width:480px;
  }

  .overlay{ position:fixed; inset:0; background:rgba(24,42,41,.4); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .sheet{ background:var(--cream); width:100%; max-width:480px; border-radius:18px 18px 0 0; padding:16px 18px 28px; max-height:88vh; overflow-y:auto; }
  .sheet-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .sheet-title{ font-size:18px; font-weight:700; }
  .icon-btn{ border:none; background:#fff; border-radius:999px; width:30px; height:30px; cursor:pointer; font-size:14px; }
  .field-label{ font-size:11.5px; font-weight:600; color:var(--slate); margin-bottom:5px; text-transform:uppercase; letter-spacing:.3px; }
  .field{ margin-bottom:12px; }
  .input{ width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line); font-size:14.5px; background:#fff; color:var(--ink); font-family:inherit; }
  .segment{ display:flex; gap:6px; margin-bottom:12px; }
  .segment-btn{ flex:1; padding:9px 6px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--slate); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .save-btn{ width:100%; margin-top:6px; padding:13px 0; border-radius:10px; border:none; background:var(--ink); color:#fff; font-size:14.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .card-hint{ font-size:11.5px; color:var(--slate); margin-top:6px; line-height:1.4; }

  .proj-hint{ font-size:11.5px; color:var(--slate); line-height:1.5; background:#fff; border-radius:10px; padding:10px 12px; }
  .proj-card{ background:#fff; border-radius:14px; padding:14px 14px 12px; border:1px solid var(--line); }
  .proj-card.current{ border:1.5px solid var(--ink); box-shadow:0 3px 10px rgba(24,42,41,.10); }
  .proj-month-header{ display:flex; align-items:baseline; gap:8px; border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:8px; }
  .proj-month-label{ font-size:16px; font-weight:700; text-transform:capitalize; }
  .proj-now-tag{ font-size:9.5px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:.4px; }
  .proj-cards-block{ background:var(--cream); border-radius:8px; padding:4px 8px; margin:6px 0 2px; }
  .proj-line{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; padding:4px 0; }
  .proj-balance{ display:flex; justify-content:space-between; align-items:center; border-radius:8px; padding:8px 10px; margin-top:8px; color:#fff; font-size:13px; font-weight:700; }

  .det-section-title{ font-size:13.5px; font-weight:700; color:var(--slate); margin-bottom:8px; text-transform:uppercase; letter-spacing:.3px; }
  .det-group{ background:#fff; border-radius:14px; padding:14px 14px 10px; }
  .det-group-header{ display:flex; justify-content:space-between; align-items:flex-start; }
  .det-group-name{ font-size:15px; font-weight:700; }
  .det-group-count{ font-size:11px; color:var(--slate); margin-top:1px; }
  .det-group-total{ font-size:15px; font-weight:700; }
  .det-group-pct{ font-size:11px; color:var(--slate); margin-top:1px; text-align:right;}
  .det-items{ margin-top:6px; border-top:1px solid var(--line); }
  .det-item{ display:flex; justify-content:space-between; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--line); gap:10px; }
  .det-item-desc{ font-size:13px; font-weight:600; }
  .det-item-meta{ font-size:10.5px; color:var(--slate); margin-top:1px; text-transform:capitalize; }
  .det-item-value{ font-size:13px; font-weight:700; white-space:nowrap; }

  .confirm-card{ background:#fff; border-radius:12px; padding:12px 14px; border-left:3px solid var(--teal); }
  .confirm-input-row{ display:flex; gap:8px; margin:10px 0 8px; }
  .confirm-btn{ border:none; border-radius:9px; color:#fff; padding:0 14px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; font-family:inherit; }
  .confirm-checkbox-row{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--slate); }
</style>
</head>
<body>

<div id="login-screen">
  <h1>Helm</h1>
  <p class="sub sans">controle de gastos</p>
  <input id="login-user" class="sans" type="text" placeholder="Usuário" autocomplete="username" />
  <input id="login-pass" class="sans" type="password" placeholder="Senha" autocomplete="current-password" />
  <button id="login-btn" class="sans">Entrar</button>
  <div id="login-error" class="sans"></div>
</div>

<div id="banks-screen" style="display:none;">
  <h1>Quais bancos você usa?</h1>
  <p class="sub sans">Selecione os cartões que você quer acompanhar no app</p>
  <div id="banks-list" class="sans"></div>
  <button id="banks-continue-btn" class="sans">Continuar</button>
</div>

<div id="invest-onboard-screen" class="sans" style="display:none;padding:24px;">
  <h1>Você já tem investimentos?</h1>
  <p class="sub sans">Se já tiver algo investido fora do Helm, cadastre aqui pra começar com o histórico certo</p>
  <div id="invest-onboard-ask" style="display:flex;gap:10px;max-width:340px;margin:0 auto;">
    <button id="iob-yes" class="sans" style="flex:1;width:auto;">Sim, já tenho</button>
    <button id="iob-no" class="sans" style="flex:1;width:auto;background:transparent;color:var(--ink);border:1.5px solid #D8D2C4;">Não tenho</button>
  </div>
  <div id="invest-onboard-form" style="display:none;max-width:420px;margin:0 auto;text-align:left;"></div>
</div>

<div id="app" class="sans" style="display:none;"></div>

<script>
// ===================== CONFIG =====================
const AUTH_USER = "Touchon";
const AUTH_PASS = "416419";
const STORAGE_KEY = "bordo_entries_v1";
const INVOICES_KEY = "bordo_invoices_v1";
const INVEST_ADJ_KEY = "bordo_invest_adjustments_v1";
const INVEST_ONBOARD_KEY = "bordo_invest_onboarded_v1";
const AUTH_KEY = "bordo_authed_v1";
const BANKS_KEY = "bordo_banks_v1";

// ===================== CONSTANTS =====================
const ALL_BANKS = [
  { id: "santander", label: "Cartão Santander", color: "#EC0000" },
  { id: "itau", label: "Cartão Itaú", color: "#EC7830" },
  { id: "xp", label: "Cartão XP", color: "#1C1C1C" },
  { id: "nubank", label: "Cartão Nubank", color: "#820AD1" },
  { id: "bb", label: "Cartão Banco do Brasil", color: "#F8D117" },
  { id: "bradesco", label: "Cartão Bradesco", color: "#CC092F" },
];
let SOURCES = []; // montado depois que o usuário escolhe os bancos (buildSources)
function buildSources(selectedBankIds){
  const cards = ALL_BANKS.filter(b => selectedBankIds.includes(b.id)).map(b => ({ ...b, isCard: true }));
  SOURCES = [...cards, { id: "pix", label: "Pix", color: "#3B6EA5", isCard: false }];
}
const EXPENSE_CATEGORIES = ["Moradia","Contas Fixas","Assinaturas","Mercado","Alimentação","Transporte","Saúde","Lazer","Compras","Educação","Outros"];
const INCOME_CATEGORIES = ["Salário","Dobras","Férias","13°","Rendimentos","Reembolso","Resgate de Investimento","Outros"];
const INVESTMENT_CATEGORIES = [
  "Renda Fixa","Tesouro Direto","CDB","LCI/LCA","Debêntures","COE",
  "Ações","Fundos Imobiliários (FII)","ETF","Fundos de Investimento",
  "Previdência Privada","Cripto","Consórcio","Poupança","Reserva de Emergência","Outros"
];
const MONTH_LABELS = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const PROJECTION_MONTHS = 6;
const APP_START_MONTH = "2026-08";
const TEAL = "#1B7A72", CORAL = "#C1553D", INK = "#182A29", SLATE = "#6E7B79", GOLD = "#B9852F";

const isCardSource = (id) => !!SOURCES.find(s => s.id === id)?.isCard;
const monthKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
const addMonths = (key, n) => { const [y,m] = key.split("-").map(Number); const d = new Date(y, m-1+n, 1); return monthKey(d); };
const monthLabel = (key) => { const [y,m] = key.split("-").map(Number); return `${MONTH_LABELS[m-1]}/${String(y).slice(2)}`; };
const fmt = (n) => (n||0).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
const uid = () => Math.random().toString(36).slice(2,10);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function parseAmount(raw){
  const s = String(raw).trim();
  if (!s) return 0;
  if (s.includes(",")) return Number(s.replace(/\./g,"").replace(",",".")) || 0;
  return Number(s) || 0;
}

function monthDiff(a,b){ const [ay,am]=a.split("-").map(Number); const [by,bm]=b.split("-").map(Number); return (by-ay)*12+(bm-am); }

function occursInPurchase(entry, mKey){
  const diff = monthDiff(entry.startMonth, mKey);
  if (entry.type === "single") return diff === 0;
  if (entry.type === "installment") return diff >= 0 && diff < (entry.installments||1);
  if (entry.type === "recurring"){
    if (diff < 0) return false;
    if (entry.endMonth && monthDiff(mKey, entry.endMonth) > 0) return false;
    return true;
  }
  return false;
}
function installmentLabel(entry, mKey){
  if (entry.type !== "installment") return null;
  const diff = monthDiff(entry.startMonth, mKey);
  return `${diff+1}/${entry.installments}`;
}
const cardShift = (entry) => (entry.flow === "expense" && isCardSource(entry.source) ? 1 : 0);

const needsConfirmation = (entry) => entry.flow === "income" || (entry.type === "recurring" && entry.flow === "expense" && entry.source === "pix");
const stripTime = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
function firstBusinessDay(mKey){
  const [y,m] = mKey.split("-").map(Number);
  let d = new Date(y, m-1, 1);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate()+1);
  return d;
}
function getConfirmStatus(entry, occMonth){
  const conf = entry.confirmations && entry.confirmations[occMonth];
  if (conf && conf.confirmed) return "confirmed";
  const today = stripTime(new Date());
  const fbd = stripTime(firstBusinessDay(occMonth));
  return today >= fbd ? "pending" : "forecast";
}
function getAllPendingConfirmations(entries){
  const todayMonth = monthKey(new Date());
  const list = [];
  entries.forEach(e => {
    if (!needsConfirmation(e)) return;
    const limit = e.endMonth && monthDiff(e.endMonth, todayMonth) < 0 ? e.endMonth : todayMonth;
    let m = monthDiff(e.startMonth, APP_START_MONTH) < 0 ? APP_START_MONTH : e.startMonth;
    let guard = 0;
    while (monthDiff(m, limit) <= 0 && guard < 240){
      if (occursInPurchase(e, m) && getConfirmStatus(e, m) === "pending") list.push({ entry: e, month: m });
      m = addMonths(m, 1); guard++;
    }
  });
  return list.sort((a,b) => monthDiff(a.month, b.month));
}
// Gastos pelo mês em que a compra foi feita (não pelo mês da fatura do cartão). Usado só para exibição
// em Visão geral / Detalhamento — o saldo continua calculado por occurrencesForCashMonth (fatura no
// mês seguinte), isso não muda.
function expensesBySpendMonth(entries, spendMonth){
  return entries
    .filter(e => e.flow === "expense" && occursInPurchase(e, spendMonth))
    .map(e => {
      const confirmStatus = needsConfirmation(e) ? getConfirmStatus(e, spendMonth) : null;
      const conf = e.confirmations && e.confirmations[spendMonth];
      const amount = confirmStatus === "confirmed" && conf ? conf.amount : e.amount;
      const invoiceMonth = addMonths(spendMonth, cardShift(e));
      return { ...e, amount, installmentLabel: installmentLabel(e, spendMonth), purchaseMonth: spendMonth, cashMonth: invoiceMonth, invoiceMonth, confirmStatus };
    })
    .filter(o => o.confirmStatus !== "pending")
    .filter(o => !o.excludeFromBalance);
}
function occurrencesForCashMonth(entries, cashMonth){
  return entries
    .map(e => ({ entry: e, purchaseMonth: addMonths(cashMonth, -cardShift(e)) }))
    .filter(({entry, purchaseMonth}) => occursInPurchase(entry, purchaseMonth))
    .map(({entry, purchaseMonth}) => {
      const confirmStatus = needsConfirmation(entry) ? getConfirmStatus(entry, purchaseMonth) : null;
      const conf = entry.confirmations && entry.confirmations[purchaseMonth];
      const amount = confirmStatus === "confirmed" && conf ? conf.amount : entry.amount;
      return { ...entry, amount, installmentLabel: installmentLabel(entry, purchaseMonth), purchaseMonth, cashMonth, confirmStatus };
    })
    .filter(o => o.confirmStatus !== "pending")
    // saldo inicial de investimento (cadastrado no onboarding) é só ponto de partida — não é uma
    // movimentação de caixa real, então não deve afetar saldo/renda/despesa em nenhuma tela.
    .filter(o => !o.excludeFromBalance)
    .filter(o => {
      // Fatura de cartão: só entra no saldo depois de confirmada (mesma lógica de renda/Pix fixo).
      if (o.flow === "expense" && isCardSource(o.source)) {
        const status = getInvoiceStatus(o.source, cashMonth);
        if (status === "pending") return false;
        const inv = invoiceConfirmations[invoiceKey(o.source, cashMonth)];
        if (inv && inv.mode === "parcelado") return false; // substituída pela entrada + parcelas geradas
      }
      return true;
    });
}
// Ocorrências de investimento por mês, incluindo o(s) lançamento(s) de saldo inicial (marco zero) do
// onboarding — usado só pela aba de Investimentos, que quer enxergar esse valor no histórico/gráficos
// mesmo ele não contando para o saldo de caixa do app.
function investmentOccurrencesForMonth(entries, mKey){
  return entries
    .filter(e => e.flow === "investment" && occursInPurchase(e, mKey))
    .map(e => ({ ...e, purchaseMonth: mKey, cashMonth: mKey }));
}
function isActiveInCashMonth(entry, cashMonth){
  return occursInPurchase(entry, addMonths(cashMonth, -cardShift(entry)));
}

// ---------- confirmação de fatura de cartão ----------
const invoiceKey = (cardId, month) => `${cardId}|${month}`;
function getInvoiceStatus(cardId, month){
  const inv = invoiceConfirmations[invoiceKey(cardId, month)];
  if (inv && inv.confirmed) return "confirmed";
  const todayMonth = monthKey(new Date());
  return monthDiff(month, todayMonth) >= 0 ? "pending" : "forecast";
}
// Total real das compras daquele cartão naquele mês, independente de confirmação (evita loop com occurrencesForCashMonth).
function rawCardInvoiceTotal(entries, cardId, month){
  return entries
    .map(e => ({ entry: e, purchaseMonth: addMonths(month, -cardShift(e)) }))
    .filter(({entry, purchaseMonth}) => entry.flow === "expense" && entry.source === cardId && occursInPurchase(entry, purchaseMonth))
    .reduce((s, {entry}) => s + entry.amount, 0);
}
function getAllPendingInvoices(entries){
  const todayMonth = monthKey(new Date());
  const list = [];
  SOURCES.filter(s => s.isCard).forEach(card => {
    let m = APP_START_MONTH, guard = 0;
    while (monthDiff(m, todayMonth) >= 0 && guard < 240){
      if (getInvoiceStatus(card.id, m) === "pending"){
        const total = rawCardInvoiceTotal(entries, card.id, m);
        if (total > 0.005) list.push({ card, month: m, total });
      }
      m = addMonths(m, 1); guard++;
    }
  });
  return list.sort((a,b) => monthDiff(a.month, b.month));
}

// ---------- posição de investimentos (histórico, rendimentos e retiradas) ----------
function investmentNames(entries){
  const set = new Set();
  entries.forEach(e => { if (e.flow === "investment") set.add(e.description); });
  return Array.from(set);
}
function categoryOfInvestment(entries, name){
  const e = entries.find(e => e.flow === "investment" && e.description === name);
  return e ? e.category : "Outros";
}
function getInvestmentPosition(entries, adjustments, name){
  const aportes = entries.filter(e => e.flow === "investment" && e.description === name).reduce((s,e) => s + e.amount, 0);
  const rendimentos = adjustments.filter(a => a.investmentName === name && a.type === "rendimento").reduce((s,a) => s + a.amount, 0);
  const retiradas = adjustments.filter(a => a.investmentName === name && a.type === "retirada").reduce((s,a) => s + a.amount, 0);
  return { aportes, rendimentos, retiradas, currentValue: aportes + rendimentos - retiradas };
}
function getAllInvestmentPositions(entries, adjustments){
  return investmentNames(entries).map(name => ({
    name,
    category: categoryOfInvestment(entries, name),
    ...getInvestmentPosition(entries, adjustments, name),
  })).sort((a,b) => b.currentValue - a.currentValue);
}

// ---- exportar / importar backup completo dos dados ----
function exportData(){
  const backup = {
    app: "helm-backup", version: 1, exportedAt: new Date().toISOString(),
    data: {
      [STORAGE_KEY]: localStorage.getItem(STORAGE_KEY),
      [INVOICES_KEY]: localStorage.getItem(INVOICES_KEY),

      [INVEST_ONBOARD_KEY]: localStorage.getItem(INVEST_ONBOARD_KEY),
      [BANKS_KEY]: localStorage.getItem(BANKS_KEY),
    }
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `helm-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function showImportToast(msg){
  const t = document.getElementById("import-toast");
  if (!t) return;
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 3200);
}

function importDataFromFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const backup = JSON.parse(reader.result);
      if (!backup || backup.app !== "helm-backup" || !backup.data) throw new Error("formato inválido");
      const ok = confirm("Isso vai substituir todos os dados atuais deste dispositivo pelos dados do arquivo importado. Continuar?");
      if (!ok) return;
      Object.entries(backup.data).forEach(([key, value]) => {
        if (value !== null && value !== undefined) localStorage.setItem(key, value);
      });
      showImportToast("Dados importados! Recarregando…");
      setTimeout(() => location.reload(), 900);
    } catch (err){
      showImportToast("Arquivo inválido — verifique se é um backup do Helm.");
    }
  };
  reader.readAsText(file);
}

function addRendimento(name, novoValorTotal, adjMonth){
  const atual = getInvestmentPosition(entries, investAdjustments, name).currentValue;
  const delta = novoValorTotal - atual;
  if (Math.abs(delta) < 0.005) return;
  investAdjustments.push({ id: uid(), investmentName: name, type: "rendimento", amount: delta, month: adjMonth, createdAt: new Date().toISOString() });
  saveInvestAdjustments();
  render();
}

function addRetirada(name, valorRetirado, adjMonth){
  if (valorRetirado <= 0.005) return;
  investAdjustments.push({ id: uid(), investmentName: name, type: "retirada", amount: valorRetirado, month: adjMonth, createdAt: new Date().toISOString() });
  saveInvestAdjustments();
  entries.push({
    id: uid(), flow: "income", description: `Resgate - ${name}`, category: "Resgate de Investimento",
    source: null, amount: valorRetirado, type: "single", startMonth: adjMonth, installments: undefined, endMonth: null,
  });
  saveEntries();
  render();
}

function addEntry(e){ entries.push({ ...e, id: uid() }); saveEntries(); render(); }
function updateEntry(id, updates){ entries = entries.map(e => e.id === id ? { ...e, ...updates } : e); saveEntries(); render(); }
function deleteEntry(id){ entries = entries.filter(e => e.id !== id); saveEntries(); render(); }
// Remove um investimento por completo: todos os lançamentos de aporte com esse nome e todos os
// ajustes de rendimento/retirada associados. Não mexe em lançamentos de "Resgate de Investimento"
// já gerados (esses já são dinheiro real que entrou no saldo, então ficam no histórico).
function deleteInvestment(name){
  entries = entries.filter(e => !(e.flow === "investment" && e.description === name));
  investAdjustments = investAdjustments.filter(a => a.investmentName !== name);
  saveEntries();
  saveInvestAdjustments();
  render();
}
function confirmOccurrence(entryId, occMonth, actualAmount, updateFixed){
  entries = entries.map(e => {
    if (e.id !== entryId) return e;
    const confirmations = { ...(e.confirmations||{}), [occMonth]: { confirmed:true, amount:actualAmount, confirmedAt:new Date().toISOString() } };
    return { ...e, confirmations, amount: updateFixed ? actualAmount : e.amount };
  });
  saveEntries(); render();
}

// Quando o mês vira de verdade (calendário), gera automaticamente um lançamento
// "Saldo anterior" com o que sobrou (ou faltou) no mês que terminou.
function checkMonthRollover(){
  const todayMonth = monthKey(new Date());
  if (monthDiff(APP_START_MONTH, todayMonth) <= 0) return;
  const alreadyDone = entries.some(e => e.autoRollover && e.startMonth === todayMonth);
  if (alreadyDone) return;
  const prevMonth = addMonths(todayMonth, -1);
  const occ = occurrencesForCashMonth(entries, prevMonth);
  const income = occ.filter(e=>e.flow==="income").reduce((s,e)=>s+e.amount,0);
  const expense = occ.filter(e=>e.flow==="expense").reduce((s,e)=>s+e.amount,0);
  const investment = occ.filter(e=>e.flow==="investment").reduce((s,e)=>s+e.amount,0);
  const prevBalance = income - expense - investment;
  if (Math.abs(prevBalance) < 0.005) return;
  const isPositive = prevBalance >= 0;
  entries.push({
    id: uid(),
    flow: isPositive ? "income" : "expense",
    description: "Saldo anterior",
    category: "Outros",
    source: isPositive ? null : "pix",
    amount: Math.abs(prevBalance),
    type: "single",
    startMonth: todayMonth,
    installments: undefined,
    endMonth: null,
    autoRollover: true,
  });
  saveEntries();
}

function confirmInvoiceFull(cardId, month, paidAmount){
  invoiceConfirmations[invoiceKey(cardId, month)] = { confirmed: true, mode: "full", paidAmount, confirmedAt: new Date().toISOString() };
  saveInvoices();
  render();
}

function confirmInvoiceParcelado(cardId, month, entrada, installmentAmount, parcelas){
  const card = SOURCES.find(s => s.id === cardId);

  invoiceConfirmations[invoiceKey(cardId, month)] = {
    confirmed: true, mode: "parcelado", paidAmount: entrada, entrada, parcelas, installmentAmount,
    confirmedAt: new Date().toISOString(),
  };
  saveInvoices();

  if (entrada > 0.005){
    entries.push({
      id: uid(), flow: "expense", description: `Entrada fatura ${card.label.replace("Cartão ","")}`,
      category: "Contas Fixas", source: "pix", amount: entrada, type: "single",
      startMonth: month, installments: undefined, endMonth: null, invoiceRef: invoiceKey(cardId, month),
    });
  }
  if (parcelas > 0 && installmentAmount > 0.005){
    entries.push({
      id: uid(), flow: "expense", description: `Parcelamento fatura ${card.label.replace("Cartão ","")}`,
      category: "Contas Fixas", source: "pix", amount: installmentAmount, type: "installment",
      installments: parcelas, startMonth: addMonths(month, 1), endMonth: null, invoiceRef: invoiceKey(cardId, month),
    });
  }
  saveEntries();
  render();
}

  // fatura do cartão (esse continua batendo no saldo só no mês seguinte, isso não muda).
  const spendExpenses = expensesBySpendMonth(entries, month);

    <div class="month-nav">

  document.getElementById("fab-add").onclick = () => openEntryForm();

function tabBtn(id, label, badge){
  return `<button class="tab-btn ${tab===id?"active":""}" data-tab="${id}">${label}${badge ? `<span class="tab-badge">${badge}</span>` : ""}</button>`;
}

function renderTab(id, ctx){
  if (id === "dashboard") return renderDashboard(ctx);
  if (id === "detalhes") return renderDetalhes(ctx);
  if (id === "lista") return renderLista(ctx);
  if (id === "projecao") return renderProjecao();
  if (id === "investimentos") return renderInvestimentos();
  if (id === "recorrentes") return renderRecorrentes();
  if (id === "confirmar") return renderConfirmacoes(ctx.pending, ctx.pendingInvoices);
  return "";
}
function wireTabEvents(id, ctx){
  if (id === "lista" || id === "recorrentes"){
    document.querySelectorAll("[data-delete]").forEach(b => b.onclick = () => deleteEntry(b.dataset.delete));
  }
  if (id === "recorrentes"){
    document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
      const entry = entries.find(e => e.id === b.dataset.edit);
      if (entry) openEntryForm(entry);
    });
  }
  if (id === "confirmar"){
    wireConfirmacoes(ctx.pending);
    wireInvoiceConfirmacoes(ctx.pendingInvoices);
  }
  if (id === "investimentos"){
    wireInvestimentos();
  }
}

function emptyState(text){
  return `<div class="empty"><div class="empty-text">${esc(text)}</div></div>`;
}

// ---- Dashboard ----
function renderDashboard({ totalIncome, balance, spendExpenses, spendTotalExpense, totalInvestment }){
  const positive = balance >= 0;
  const expenses = spendExpenses;
  const totalExpense = spendTotalExpense;
  const bySource = SOURCES.map(s => ({...s, total: expenses.filter(e => e.source===s.id).reduce((sum,e)=>sum+e.amount,0)}));
  const byCategory = (() => {
    const map = {};
    expenses.forEach(e => map[e.category] = (map[e.category]||0)+e.amount);
    return Object.entries(map).map(([category,total])=>({category,total})).sort((a,b)=>b.total-a.total);
  })();

  let html = `
    <div class="cards-row">
      <div class="stat-card"><div class="stat-label">Renda</div><div class="stat-value">${fmt(totalIncome)}</div></div>
      <div class="stat-card coral"><div class="stat-label">Gastos</div><div class="stat-value">${fmt(totalExpense)}</div></div>
    </div>
    ${totalInvestment > 0 ? `<div class="stat-card" style="border-color:${GOLD}"><div class="stat-label">Investido no mês</div><div class="stat-value">${fmt(totalInvestment)}</div></div>` : ""}
    <div class="balance-card" style="background:${positive?TEAL:CORAL}">
      <div class="balance-label">Saldo do mês</div>
      <div class="balance-value">${fmt(balance)}</div>
    </div>
  `;

  if (totalExpense > 0){
    const max = Math.max(1, ...bySource.map(s=>s.total));
    html += `<div class="panel"><div class="panel-title">Por Pix e cartão</div>${bySource.map(s=>`
      <div class="cat-row"><span>${s.label}</span><span>${fmt(s.total)}</span></div>
      <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${(s.total/max)*100}%;background:${s.color}"></div></div>
    `).join("")}</div>`;
  }
  if (byCategory.length){
    html += `<div class="panel"><div class="panel-title">Por categoria</div>${byCategory.map(c=>`
      <div class="cat-row"><span>${esc(c.category)}</span><span>${fmt(c.total)}</span></div>
      <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${totalExpense?(c.total/totalExpense)*100:0}%"></div></div>
    `).join("")}</div>`;
  }
  if (totalExpense === 0 && !byCategory.length) html += emptyState("Nenhum lançamento neste mês ainda. Toque no + para começar.");
  return html;
}

// ---- Detalhamento ----
function groupByCategory(items){
  const map = {};
  items.forEach(e => { (map[e.category] = map[e.category]||[]).push(e); });
  return Object.entries(map).map(([category, groupItems]) => ({
    category, items: groupItems.sort((a,b)=>b.amount-a.amount), total: groupItems.reduce((s,e)=>s+e.amount,0)
  })).sort((a,b)=>b.total-a.total);
}
function renderCategoryGroups(groups, total, barColor){
  return groups.map(g => {
    const pct = total ? (g.total/total)*100 : 0;
    return `<div class="det-group">
      <div class="det-group-header">
        <div><div class="det-group-name">${esc(g.category)}</div><div class="det-group-count">${g.items.length} lançamento${g.items.length>1?"s":""}</div></div>
        <div><div class="det-group-total">${fmt(g.total)}</div><div class="det-group-pct">${pct.toFixed(0)}% do total</div></div>
      </div>
      <div class="cat-bar-bg" style="margin-top:9px;"><div class="cat-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
      <div class="det-items">${g.items.map(it => {
        const src = SOURCES.find(s=>s.id===it.source);
        const tag = it.confirmStatus === "forecast" ? " · previsto" : it.confirmStatus === "confirmed" ? " · confirmado" : "";
        const invoiceTag = it.invoiceMonth && it.invoiceMonth !== it.purchaseMonth ? ` · fatura ${monthLabel(it.invoiceMonth)}` : "";
        return `<div class="det-item">
          <div><div class="det-item-desc">${esc(it.description)}</div>
          <div class="det-item-meta">${src?src.label:""}${it.type==="recurring"?" · fixo/assinatura":""}${it.installmentLabel?` · parcela ${it.installmentLabel}`:""}${tag}${invoiceTag}</div></div>
          <div class="det-item-value">${fmt(it.amount)}</div>
        </div>`;
      }).join("")}</div>
    </div>`;
  }).join("");
}
function renderDetalhes({ spendExpenses, spendTotalExpense, investments }){
  const expenseGroups = groupByCategory(spendExpenses);
  const investmentGroups = groupByCategory(investments);
  const totalInvestment = investments.reduce((s,e)=>s+e.amount,0);

  if (!expenseGroups.length && !investmentGroups.length) return emptyState("Nenhum gasto neste mês ainda. Toque no + para lançar.");

  let html = "";
  if (expenseGroups.length){
    html += `<div class="det-section-title">Gastos por categoria</div>${renderCategoryGroups(expenseGroups, spendTotalExpense, TEAL)}`;
  }
  if (investmentGroups.length){
    html += `<div class="det-section-title" style="margin-top:${expenseGroups.length?"20px":"0"};">Investido no mês · ${fmt(totalInvestment)}</div>${renderCategoryGroups(investmentGroups, totalInvestment, GOLD)}`;
  }
  return html;
}

// ---- Lista ----
function renderLista({ expenses, incomes, investments }){
  const all = [
    ...incomes.map(e=>({...e,kind:"income"})),
    ...investments.map(e=>({...e,kind:"investment"})),
    ...expenses.map(e=>({...e,kind:"expense"})),
  ];
  if (!all.length) return emptyState("Nenhum lançamento neste mês ainda. Toque no + para começar.");
  return `<div style="display:flex;flex-direction:column;gap:8px;">${all.map(e => {
    const src = SOURCES.find(s=>s.id===e.source);
    const tag = e.confirmStatus === "forecast" ? " · previsto" : e.confirmStatus === "confirmed" ? " · confirmado" : "";
    const dotColor = e.kind==="income" ? TEAL : e.kind==="investment" ? GOLD : (src?src.color:SLATE);
    const valueColor = e.kind==="income" ? TEAL : e.kind==="investment" ? GOLD : INK;
    const sign = e.kind==="expense" ? "− " : "+ ";
    return `<div class="entry-row">
      <div class="entry-dot" style="background:${dotColor}"></div>
      <div style="flex:1;min-width:0;">
        <div class="entry-desc">${esc(e.description)}</div>
        <div class="entry-meta">${esc(e.category)}${e.kind==="investment"?" · investimento":""}${src?` · ${src.label}`:""}${e.type==="recurring"?" · fixo":""}${e.installmentLabel?` · parcela ${e.installmentLabel}`:""}${tag}</div>
      </div>
      <div class="entry-value" style="color:${valueColor}">${sign}${fmt(e.amount)}</div>
      <button class="delete-btn" data-delete="${e.id}">✕</button>
    </div>`;
  }).join("")}</div>`;
}

// ---- Projeção ----
function renderProjecao(){
  // Sempre ancorado em agosto/2026 (início do app) e estende até 5 meses após o mês selecionado.
  const endMonth = addMonths(month, PROJECTION_MONTHS - 1);
  const totalMonths = monthDiff(APP_START_MONTH, endMonth) + 1;
  const months = Array.from({length: totalMonths}, (_,i) => addMonths(APP_START_MONTH, i));
  const todayMonth = monthKey(new Date());

  const rows = months.map(m => {
    const occ = occurrencesForCashMonth(entries, m);
    const income = occ.filter(e=>e.flow==="income").reduce((s,e)=>s+e.amount,0);
    const fixedExpense = occ.filter(e=>e.flow==="expense" && !isCardSource(e.source)).reduce((s,e)=>s+e.amount,0);
    const cardTotals = SOURCES.filter(s=>s.isCard).map(s=>({...s, total: occ.filter(e=>e.flow==="expense"&&e.source===s.id).reduce((sum,e)=>sum+e.amount,0)})).filter(c=>c.total>0);
    const cardTotal = cardTotals.reduce((s,c)=>s+c.total,0);
    const investment = occ.filter(e=>e.flow==="investment").reduce((s,e)=>s+e.amount,0);
    const monthBalance = income - fixedExpense - cardTotal - investment;
    return { month:m, income, fixedExpense, cardTotals, investment, monthBalance };
  });

  let html = `<div class="proj-hint">Compras no cartão entram na fatura do mês seguinte à compra — os valores abaixo já refletem isso. Quando um mês fecha com saldo sobrando (ou faltando), um lançamento de "Saldo anterior" é criado automaticamente no mês seguinte.</div>`;
  rows.forEach((r) => {
    const isCurrent = r.month === todayMonth;
    const positive = r.monthBalance >= 0;
    html += `<div class="proj-card ${isCurrent?"current":""}">
      <div class="proj-month-header"><span class="proj-month-label">${monthLabel(r.month)}</span>${isCurrent?'<span class="proj-now-tag">mês atual</span>':""}</div>
      <div class="proj-line"><span style="color:${TEAL};font-weight:500">Renda</span><span style="color:${TEAL};font-weight:600">${fmt(r.income)}</span></div>
      <div class="proj-line"><span style="font-weight:500">Gastos fixos (Pix / boleto)</span><span style="color:${SLATE};font-weight:600">${fmt(r.fixedExpense)}</span></div>
      ${r.investment>0 ? `<div class="proj-line"><span style="font-weight:500;color:${GOLD}">Investimentos</span><span style="font-weight:600;color:${GOLD}">${fmt(r.investment)}</span></div>` : ""}
      ${r.cardTotals.length ? `<div class="proj-cards-block">${r.cardTotals.map(c=>`
        <div class="proj-line"><span style="font-weight:500"><span style="width:7px;height:7px;border-radius:999px;background:${c.color};display:inline-block;margin-right:6px;"></span>Fatura ${c.label.replace("Cartão ","")}</span><span style="color:${SLATE};font-weight:600">${fmt(c.total)}</span></div>
      `).join("")}</div>` : ""}
      <div class="proj-balance" style="background:${positive?TEAL:CORAL}"><span>Saldo do mês</span><span>${fmt(r.monthBalance)}</span></div>
    </div>`;
  });
  return html;
}

// Cria um lançamento de investimento "marco inicial" (não afeta saldo, conta como ponto de partida
// no acumulado). Usado tanto pelo onboarding do login quanto pelo botão "Investimento anterior ao
// Helm" dentro da própria aba de Investimentos.
function createBaselineInvestment(name, category, aportadoRaw, atualRaw, monthOverride){
  const aportado = parseAmount(aportadoRaw);
  if (!name.trim() || !(aportado > 0)) return false;
  const currentMonth = monthKey(new Date());
  const startMonth = monthOverride || (monthDiff(APP_START_MONTH, currentMonth) < 0 ? APP_START_MONTH : currentMonth);
  entries.push({
    id: uid(), flow: "investment", description: name.trim(), category, source: null,
    amount: aportado, type: "single", startMonth, installments: undefined, endMonth: null,
    excludeFromBalance: true,
    isBaseline: true,
  });
  const atual = atualRaw && atualRaw.trim() ? parseAmount(atualRaw) : aportado;
  if (Math.abs(atual - aportado) > 0.005){
    investAdjustments.push({ id: uid(), investmentName: name.trim(), type: "rendimento", amount: atual - aportado, month: startMonth, createdAt: new Date().toISOString() });
  }
  return true;
}
function finishInvestOnboarding(){
  loadEntries();
  loadInvestAdjustments();
  onboardRows.forEach(row => createBaselineInvestment(row.name, row.category, row.aportado, row.atual));
  saveEntries();
  saveInvestAdjustments();
  localStorage.setItem(INVEST_ONBOARD_KEY, "1");
  onboardRows = [{ name: "", category: INVESTMENT_CATEGORIES[0], aportado: "", atual: "" }];
  document.getElementById("invest-onboard-screen").style.display = "none";
  showApp();
}

function buildAccumulatedChartSVG(data){
  // data: [{ month, total }] — valor total acumulado (aportes + rendimentos) até aquele mês
  const W = 600, H = 200, padL = 8, padR = 8, padT = 16, padB = 26;
  const n = data.length;
  if (n === 0) return "";
  const maxV = Math.max(...data.map(d => d.total), 1) * 1.1;
  const minV = 0;
  const xStep = n > 1 ? (W - padL - padR) / (n - 1) : 0;
  const xAt = (i) => padL + i * xStep;
  const yAt = (v) => padT + (1 - (v - minV) / (maxV - minV)) * (H - padT - padB);
  const floorY = yAt(0);

  const points = data.map((d,i) => [xAt(i), yAt(d.total)]);
  const linePath = points.map((p,i) => `${i===0?"M":"L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const areaPath = `${linePath} L${points[n-1][0].toFixed(1)},${floorY.toFixed(1)} L${points[0][0].toFixed(1)},${floorY.toFixed(1)} Z`;

  const labelStep = Math.max(1, Math.ceil(n / 5));
  const labelIdxs = new Set();
  for (let i = 0; i < n; i += labelStep) labelIdxs.add(i);
  labelIdxs.add(n - 1);
  const gradId = "accGrad";

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" preserveAspectRatio="none">
      <defs>
        <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${GOLD}" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="${GOLD}" stop-opacity="0.02"/>
        </linearGradient>
      </defs>
      <path d="${areaPath}" fill="url(#${gradId})" stroke="none"/>
      <path d="${linePath}" fill="none" stroke="${GOLD}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${points[n-1][0].toFixed(1)}" cy="${points[n-1][1].toFixed(1)}" r="4.5" fill="${GOLD}" stroke="#fff" stroke-width="1.5"/>
      ${Array.from(labelIdxs).sort((a,b)=>a-b).map(i => `
        <text x="${xAt(i).toFixed(1)}" y="${H-8}" font-size="11" fill="${SLATE}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}" font-family="system-ui,sans-serif">${monthLabel(data[i].month)}</text>
      `).join("")}
    </svg>
    <div style="text-align:right;font-size:13px;font-weight:700;color:${INK};margin-top:2px;">${fmt(data[n-1].total)}</div>
  `;
}
function buildMonthlyBarsSVG(data){
  // data: [{ month, aporte }] — quanto foi aportado em cada mês
  const W = 600, H = 200, padL = 8, padR = 8, padT = 16, padB = 26;
  const n = data.length;
  if (n === 0) return "";
  const maxV = Math.max(...data.map(d => d.aporte), 1) * 1.15;
  const gap = 6;
  const barW = n > 0 ? Math.max(4, (W - padL - padR - gap * (n - 1)) / n) : 0;
  const yAt = (v) => padT + (1 - v / maxV) * (H - padT - padB);
  const baseY = H - padB;

  const bars = data.map((d,i) => {
    const x = padL + i * (barW + gap);
    const y = yAt(d.aporte);
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${(baseY-y).toFixed(1)}" rx="3" fill="${GOLD}"/>`;
  }).join("");

  const labelStep = Math.max(1, Math.ceil(n / 5));
  const labelIdxs = new Set();
  for (let i = 0; i < n; i += labelStep) labelIdxs.add(i);
  labelIdxs.add(n - 1);

  const totalWindow = data.reduce((s,d) => s + d.aporte, 0);

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" preserveAspectRatio="none">
      <line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="${SLATE}" stroke-width="1" opacity="0.25"/>
      ${bars}
      ${Array.from(labelIdxs).sort((a,b)=>a-b).map(i => {
        const x = padL + i * (barW + gap) + barW/2;
        return `<text x="${x.toFixed(1)}" y="${H-8}" font-size="11" fill="${SLATE}" text-anchor="middle" font-family="system-ui,sans-serif">${monthLabel(data[i].month)}</text>`;
      }).join("")}
    </svg>
    <div style="text-align:right;font-size:13px;font-weight:700;color:${INK};margin-top:2px;">Total no período: ${fmt(totalWindow)}</div>
  `;
}
function renderInvestimentos(){
  const positions = getAllInvestmentPositions(entries, investAdjustments);
  const totalAportado = positions.reduce((s,p) => s + p.aportes, 0);
  const totalAtual = positions.reduce((s,p) => s + p.currentValue, 0);
  const ganho = totalAtual - totalAportado;

  if (positions.length === 0){
    return emptyState("Nenhum investimento lançado ainda. Toque no + e escolha \"Investimento\" para começar.");
  }

  const todayMonth = monthKey(new Date());
  // "Aportes por mês" continua olhando ocorrência real por mês (útil pra ver contribuições recorrentes,
  // tipo um consórcio que é pago todo mês). Só consideramos meses até hoje, ou até o fim de um
  // lançamento com data definida (único/parcelado/recorrente com término) — recorrência sem fim não
  // projeta pro futuro.
  let latestBoundedMonth = todayMonth;
  entries.forEach(e => {
    if (e.flow !== "investment") return;
    let endOfEntry = null;
    if (e.type === "single") endOfEntry = e.startMonth;
    else if (e.type === "installment") endOfEntry = addMonths(e.startMonth, (e.installments||1) - 1);
    else if (e.type === "recurring" && e.endMonth) endOfEntry = e.endMonth;
    if (endOfEntry && monthDiff(latestBoundedMonth, endOfEntry) > 0) latestBoundedMonth = endOfEntry;
  });
  const months = [];
  let m = APP_START_MONTH, guard = 0;
  while (monthDiff(m, latestBoundedMonth) >= 0 && guard < 240){ months.push(m); m = addMonths(m, 1); guard++; }
  const monthlyData = months.map(mo => {
    const occ = investmentOccurrencesForMonth(entries, mo);
    return {
      month: mo,
      // "aporte" = só contribuições reais feitas naquele mês (exclui o marco inicial do onboarding,
      // que não foi investido naquele mês — só é a informação de quanto já se tinha investido).
      aporte: occ.filter(e => !e.isBaseline).reduce((s,e) => s+e.amount, 0),
      rendimento: investAdjustments.filter(a => a.type === "rendimento" && a.month === mo).reduce((s,a) => s+a.amount, 0),
    };
  });
  const chartWindow = monthlyData.slice(-investChartRange);

  // "Valor total acumulado" precisa bater exatamente com Total aportado / Valor atual, então é montado
  // a partir dos mesmos eventos usados nesses totais (cada lançamento conta uma vez, no mês em que
  // começou — não por ocorrência recorrente — e cada ajuste de rendimento/retirada no mês em que foi
  // registrado). Isso evita qualquer divergência entre o gráfico e os cards.
  const accEvents = [];
  entries.forEach(e => { if (e.flow === "investment") accEvents.push({ month: e.startMonth, amount: e.amount }); });
  investAdjustments.forEach(a => {
    if (a.type === "rendimento") accEvents.push({ month: a.month, amount: a.amount });
    if (a.type === "retirada") accEvents.push({ month: a.month, amount: -a.amount });
  });
  let accEndMonth = todayMonth;
  accEvents.forEach(ev => { if (ev.month && monthDiff(accEndMonth, ev.month) > 0) accEndMonth = ev.month; });
  const accMonths = [];
  { let mm = APP_START_MONTH, g2 = 0; while (monthDiff(mm, accEndMonth) >= 0 && g2 < 240){ accMonths.push(mm); mm = addMonths(mm, 1); g2++; } }
  let running = 0;
  const accumulatedData = accMonths.map(mo => {
    running += accEvents.filter(ev => ev.month === mo).reduce((s,ev) => s + ev.amount, 0);
    return { month: mo, total: running };
  });
  const accWindow = accumulatedData.slice(-investChartRange);

  const byCategory = {};
  positions.forEach(p => { byCategory[p.category] = (byCategory[p.category]||0) + p.currentValue; });
  const categoryList = Object.entries(byCategory).map(([category,total])=>({category,total})).sort((a,b)=>b.total-a.total);

  const rangeButtons = `<div class="segment" style="margin-bottom:12px;">
    ${[3,6,12].map(r => `<button class="segment-btn range-btn" data-range="${r}" style="${investChartRange===r?`background:${GOLD};color:#fff;border-color:${GOLD};`:""}">${r} meses</button>`).join("")}
  </div>`;

  let html = `
    <div class="balance-card" style="background:${GOLD}">
      <div class="balance-label">Valor atual</div>
      <div class="balance-value">${fmt(totalAtual)}</div>
    </div>
    <div class="cards-row">
      <div class="stat-card"><div class="stat-label">Total aportado</div><div class="stat-value">${fmt(totalAportado)}</div></div>
      <div class="stat-card" style="border-color:${ganho>=0?TEAL:CORAL}"><div class="stat-label">${ganho>=0?"Rendimento acumulado":"Perda acumulada"}</div><div class="stat-value" style="color:${ganho>=0?TEAL:CORAL}">${fmt(Math.abs(ganho))}</div></div>
    </div>
  `;

  html += `<div class="panel">`;
  if (!addBaselineOpen){
    html += `<button class="segment-btn" id="add-baseline-toggle" style="width:100%;">+ Investimento anterior ao Helm</button>`;
  } else {
    html += `
      <div class="panel-title">Investimento anterior ao Helm</div>
      <p style="font-size:12.5px;color:${SLATE};line-height:1.5;margin:2px 0 12px;">Esqueceu de cadastrar algum investimento que você já tinha antes de começar a usar o app? Adicione aqui — ele entra como ponto de partida no gráfico de valor acumulado, sem afetar seu saldo.</p>
      <div class="field"><div class="field-label">Nome do investimento</div><input class="input" id="ab-name" placeholder="Ex: Tesouro Selic, FII XPML11..." value="${esc(addBaselineRow.name)}"></div>
      <div class="field"><div class="field-label">Tipo</div>
        <select class="input" id="ab-category">
          ${INVESTMENT_CATEGORIES.map(c => `<option value="${esc(c)}" ${addBaselineRow.category===c?"selected":""}>${esc(c)}</option>`).join("")}
        </select>
      </div>
      <div class="field"><div class="field-label">Valor já investido (aportado)</div><input class="input" id="ab-aportado" inputmode="decimal" placeholder="0,00" value="${esc(addBaselineRow.aportado)}"></div>
      <div class="field"><div class="field-label">Valor atual (opcional, se já tiver rendimento)</div><input class="input" id="ab-atual" inputmode="decimal" placeholder="Igual ao aportado" value="${esc(addBaselineRow.atual)}"></div>
      <div class="field"><div class="field-label">A partir de qual mês contar?</div><input class="input" type="month" id="ab-month" min="${APP_START_MONTH}" value="${APP_START_MONTH}"></div>
      <div style="display:flex;gap:10px;">
        <button class="segment-btn" id="add-baseline-cancel" style="flex:1;">Cancelar</button>
        <button class="save-btn" id="add-baseline-save" style="flex:1;">Adicionar</button>
      </div>
    `;
  }
  html += `</div>`;

  if (accWindow.length){
    html += `<div class="panel">
      <div class="panel-title">Valor total acumulado</div>
      ${rangeButtons}
      ${buildAccumulatedChartSVG(accWindow)}
    </div>`;
  }

  if (chartWindow.length){
    html += `<div class="panel">
      <div class="panel-title">Aportes por mês</div>
      ${buildMonthlyBarsSVG(chartWindow)}
    </div>`;
  }

  html += `<div class="panel"><div class="panel-title">Onde está investido</div>${categoryList.map(c=>`
    <div class="cat-row"><span>${esc(c.category)}</span><span>${fmt(c.total)}</span></div>
    <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${totalAtual?(c.total/totalAtual)*100:0}%;background:${GOLD}"></div></div>
  `).join("")}</div>`;

  html += `<div style="display:flex;flex-direction:column;gap:8px;">`;
  positions.forEach((p, idx) => {
    const posGanho = p.currentValue - p.aportes;
    html += `<div class="confirm-card" style="border-color:${GOLD}" data-pos-idx="${idx}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <div class="entry-desc">${esc(p.name)}</div>
        <button class="pos-delete" data-name="${esc(p.name)}" style="background:none;border:none;color:${CORAL};font-size:12.5px;cursor:pointer;padding:2px 0;white-space:nowrap;">Excluir</button>
      </div>
      <div class="entry-meta" style="margin-bottom:6px;">${esc(p.category)} · aportado ${fmt(p.aportes)}${p.rendimentos?` · rendimento ${fmt(p.rendimentos)}`:""}${p.retiradas?` · retirado ${fmt(p.retiradas)}`:""}</div>
      <div class="proj-line" style="padding:0 0 8px;">
        <span style="font-weight:700;">Valor atual</span>
        <span style="font-weight:700;color:${posGanho>=0?TEAL:CORAL};">${fmt(p.currentValue)}</span>
      </div>
      <button class="segment-btn" id="pos-toggle-${idx}" style="width:100%;">Atualizar valor</button>
      <div id="pos-form-${idx}" style="display:none;margin-top:10px;">
        <div class="segment">
          <button class="segment-btn" id="pos-type-rendimento-${idx}" style="background:${TEAL};color:#fff;border-color:${TEAL};">Rendimento</button>
          <button class="segment-btn" id="pos-type-retirada-${idx}">Retirada</button>
        </div>
        <div class="field" id="pos-field-rendimento-${idx}">
          <div class="field-label">Valor atual total do investimento</div>
          <input class="input" type="text" inputmode="decimal" value="${String(p.currentValue).replace(".",",")}" id="pos-val-rendimento-${idx}">
        </div>
        <div class="field" id="pos-field-retirada-${idx}" style="display:none;">
          <div class="field-label">Valor retirado (vai para o saldo disponível)</div>
          <input class="input" type="text" inputmode="decimal" placeholder="0,00" id="pos-val-retirada-${idx}">
        </div>
        <div class="field">
          <div class="field-label">Mês</div>
          <input class="input" type="month" min="${APP_START_MONTH}" value="${month}" id="pos-month-${idx}">
        </div>
        <button class="save-btn" id="pos-save-${idx}">Salvar atualização</button>
      </div>
    </div>`;
  });
  html += `</div>`;

  const rendimentoRows = monthlyData.filter(x => Math.abs(x.rendimento) > 0.005);
  if (rendimentoRows.length){
    html += `<div class="panel">
      <div class="panel-title">Rendimento por mês</div>
      ${rendimentoRows.map(x => `
        <div class="cat-row"><span style="text-transform:capitalize;">${monthLabel(x.month)}</span><span style="color:${x.rendimento>=0?TEAL:CORAL};font-weight:700;">${x.rendimento>=0?"+":""}${fmt(x.rendimento)}</span></div>
      `).join("")}
    </div>`;
  }

  return html;
}
function wireInvestimentos(){
  document.querySelectorAll(".range-btn").forEach(b => {
    b.onclick = () => { investChartRange = Number(b.dataset.range); render(); };
  });
  const abToggle = document.getElementById("add-baseline-toggle");
  if (abToggle) abToggle.onclick = () => { addBaselineOpen = true; render(); };
  const abCancel = document.getElementById("add-baseline-cancel");
  if (abCancel) abCancel.onclick = () => { addBaselineOpen = false; addBaselineRow = { name: "", category: INVESTMENT_CATEGORIES[0], aportado: "", atual: "" }; render(); };
  const abSave = document.getElementById("add-baseline-save");
  if (abSave) abSave.onclick = () => {
    const name = document.getElementById("ab-name").value;
    const category = document.getElementById("ab-category").value;
    const aportado = document.getElementById("ab-aportado").value;
    const atual = document.getElementById("ab-atual").value;
    const monthField = document.getElementById("ab-month").value || APP_START_MONTH;
    const ok = createBaselineInvestment(name, category, aportado, atual, monthField);
    if (!ok){ alert("Preencha o nome e o valor aportado."); return; }
    saveEntries();
    saveInvestAdjustments();
    addBaselineOpen = false;
    addBaselineRow = { name: "", category: INVESTMENT_CATEGORIES[0], aportado: "", atual: "" };
    render();
  };
  document.querySelectorAll(".pos-delete").forEach(b => {
    b.onclick = () => {
      const name = b.dataset.name;
      if (confirm(`Excluir o investimento "${name}"? Isso apaga todos os aportes e ajustes de rendimento/retirada lançados para ele. Essa ação não pode ser desfeita.`)){
        deleteInvestment(name);
      }
    };
  });
  const positions = getAllInvestmentPositions(entries, investAdjustments);
  positions.forEach((p, idx) => {
    const toggleBtn = document.getElementById(`pos-toggle-${idx}`);
    const form = document.getElementById(`pos-form-${idx}`);
    if (!toggleBtn) return;
    toggleBtn.onclick = () => { form.style.display = form.style.display === "none" ? "block" : "none"; };

    let type = "rendimento";
    const btnRend = document.getElementById(`pos-type-rendimento-${idx}`);
    const btnRet = document.getElementById(`pos-type-retirada-${idx}`);
    const fieldRend = document.getElementById(`pos-field-rendimento-${idx}`);
    const fieldRet = document.getElementById(`pos-field-retirada-${idx}`);
    const setType = (t) => {
      type = t;
      btnRend.style.cssText = t==="rendimento" ? `background:${TEAL};color:#fff;border-color:${TEAL}` : "";
      btnRet.style.cssText = t==="retirada" ? `background:${CORAL};color:#fff;border-color:${CORAL}` : "";
      fieldRend.style.display = t==="rendimento" ? "block" : "none";
      fieldRet.style.display = t==="retirada" ? "block" : "none";
    };
    btnRend.onclick = () => setType("rendimento");
    btnRet.onclick = () => setType("retirada");

    document.getElementById(`pos-val-rendimento-${idx}`).addEventListener("input", (e) => { e.target.value = e.target.value.replace(/[^0-9.,]/g, ""); });
    document.getElementById(`pos-val-retirada-${idx}`).addEventListener("input", (e) => { e.target.value = e.target.value.replace(/[^0-9.,]/g, ""); });

    document.getElementById(`pos-save-${idx}`).onclick = () => {
      const adjMonth = document.getElementById(`pos-month-${idx}`).value || month;
      if (type === "rendimento"){
        const novoValor = parseAmount(document.getElementById(`pos-val-rendimento-${idx}`).value);
        if (novoValor < 0) return;
        addRendimento(p.name, novoValor, adjMonth);
      } else {
        const valor = parseAmount(document.getElementById(`pos-val-retirada-${idx}`).value);
        if (valor <= 0) return;
        addRetirada(p.name, valor, adjMonth);
      }
    };
  });
}

// ---- Recorrentes ----
function renderRecorrentes(){
  const defs = entries.filter(e => e.type==="recurring" || e.type==="installment");
  if (!defs.length) return emptyState("Você ainda não tem assinaturas fixas ou compras parceladas cadastradas.");
  return `<div style="display:flex;flex-direction:column;gap:8px;">${defs.map(e => {
    const src = SOURCES.find(s=>s.id===e.source);
    const active = isActiveInCashMonth(e, month);
    const confTag = needsConfirmation(e) ? ` · ${{forecast:"previsto",pending:"aguardando confirmação",confirmed:"confirmado"}[getConfirmStatus(e, month)]}` : "";
    return `<div class="entry-row" style="opacity:${active?1:0.45}">
      <div class="entry-dot"></div>
      <div style="flex:1;min-width:0;">
        <div class="entry-desc">${esc(e.description)}</div>
        <div class="entry-meta">${e.type==="recurring" ? `Fixo desde ${monthLabel(e.startMonth)}${e.endMonth?` até ${monthLabel(e.endMonth)}`:""}` : `${e.installments}x de ${fmt(e.amount)} desde ${monthLabel(e.startMonth)}`}${src?` · ${src.label}`:""}${confTag}</div>
      </div>
      <div class="entry-value" style="color:${e.flow==="income"?TEAL:e.flow==="investment"?GOLD:INK}">${fmt(e.amount)}</div>
      <button class="delete-btn" data-edit="${e.id}" title="Editar">✎</button>
      <button class="delete-btn" data-delete="${e.id}">✕</button>
    </div>`;
  }).join("")}</div>`;
}

// ---- Confirmações ----
function renderConfirmacoes(pending, pendingInvoices){
  if (!pending.length && !pendingInvoices.length){
    return emptyState("Nada pendente por aqui. Assim que o mês virar, suas rendas, contas fixas no Pix e faturas de cartão aparecem para confirmação.");
  }
  let html = "";
  if (pending.length){
    html += `<div class="proj-hint">A partir do primeiro dia útil de cada mês, confirme aqui se a renda caiu e as contas fixas no Pix foram pagas — com o valor real. Até confirmar, esses valores não entram no saldo.</div>`;
    pending.forEach(({entry, month:m}, idx) => {
      const isIncome = entry.flow === "income";
      const incomeLabel = entry.type === "recurring" ? "Renda fixa" : entry.type === "installment" ? "Renda parcelada" : "Renda avulsa";
      html += `<div class="confirm-card" style="border-color:${isIncome?TEAL:CORAL}" data-conf-idx="${idx}">
        <div class="entry-desc">${esc(entry.description)}</div>
        <div class="entry-meta" style="margin-bottom:0;">${isIncome?incomeLabel:"Conta fixa · Pix"} · ${monthLabel(m)} · previsto ${fmt(entry.amount)}</div>
        <div class="confirm-input-row">
          <input class="input" type="text" inputmode="decimal" value="${String(entry.amount).replace(".",",")}" id="conf-val-${idx}" style="flex:1;">
          <button class="confirm-btn" style="background:${isIncome?TEAL:INK}" id="conf-btn-${idx}">${isIncome?"Confirmar recebido":"Confirmar pago"}</button>
        </div>
        <label class="confirm-checkbox-row"><input type="checkbox" id="conf-fix-${idx}"> Usar esse valor como novo valor fixo a partir de agora</label>
      </div>`;
    });
  }
  if (pendingInvoices.length){
    html += `<div class="proj-hint" style="margin-top:${pending.length?"16px":"0"};">Assim que o mês vira, confirme aqui o pagamento da fatura de cada cartão. Ela só sai do seu saldo (como um Pix) depois que você confirmar — integral ou parcelada.</div>`;
    pendingInvoices.forEach(({card, month:m, total}, idx) => {
      html += `<div class="confirm-card" style="border-color:${card.color}" data-inv-idx="${idx}">
        <div class="entry-desc">${esc(card.label)}</div>
        <div class="entry-meta" style="margin-bottom:0;">Fatura · ${monthLabel(m)} · fechada em ${fmt(total)}</div>

        <div id="inv-full-${idx}">
          <div class="confirm-input-row">
            <input class="input" type="text" inputmode="decimal" value="${String(total).replace(".",",")}" id="inv-val-${idx}" style="flex:1;">
            <button class="confirm-btn" style="background:${INK}" id="inv-btn-full-${idx}">Confirmar pagamento</button>
          </div>
          <label class="confirm-checkbox-row"><input type="checkbox" id="inv-toggle-${idx}"> Parcelar o restante</label>
        </div>

        <div id="inv-parcel-${idx}" style="display:none;">
          <div class="field" style="margin-top:10px;">
            <div class="field-label">Valor de entrada (paga agora, mês de ${monthLabel(m)})</div>
            <input class="input" type="text" inputmode="decimal" placeholder="0,00" id="inv-entrada-${idx}">
          </div>
          <div class="field">
            <div class="field-label">Valor de cada parcela (com juros, se houver)</div>
            <input class="input" type="text" inputmode="decimal" placeholder="0,00" id="inv-parcela-valor-${idx}">
          </div>
          <div class="field">
            <div class="field-label">Número de parcelas (a partir de ${monthLabel(addMonths(m,1))})</div>
            <input class="input" type="number" min="1" value="2" id="inv-parcelas-${idx}">
          </div>
          <div class="card-hint" id="inv-preview-${idx}"></div>
          <button class="confirm-btn" style="background:${INK};width:100%;margin-top:8px;" id="inv-btn-parcel-${idx}">Confirmar parcelamento</button>
        </div>
      </div>`;
    });
  }
  return html;
}
function wireConfirmacoes(pending){
  pending.forEach(({entry, month:m}, idx) => {
    const btn = document.getElementById(`conf-btn-${idx}`);
    if (!btn) return;
    btn.onclick = () => {
      const val = document.getElementById(`conf-val-${idx}`).value;
      const updateFixed = document.getElementById(`conf-fix-${idx}`).checked;
      const parsed = parseAmount(val);
      if (parsed <= 0) return;
      confirmOccurrence(entry.id, m, parsed, updateFixed);
    };
    document.getElementById(`conf-val-${idx}`).addEventListener("input", (e) => {
      e.target.value = e.target.value.replace(/[^0-9.,]/g, "");
    });
  });
}
function wireInvoiceConfirmacoes(pendingInvoices){
  pendingInvoices.forEach(({card, month:m, total}, idx) => {
    const fullBlock = document.getElementById(`inv-full-${idx}`);
    const parcelBlock = document.getElementById(`inv-parcel-${idx}`);
    const toggle = document.getElementById(`inv-toggle-${idx}`);
    if (!toggle) return;

    toggle.onchange = () => {
      fullBlock.style.display = toggle.checked ? "none" : "block";
      parcelBlock.style.display = toggle.checked ? "block" : "none";
    };

    document.getElementById(`inv-val-${idx}`).addEventListener("input", (e) => {
      e.target.value = e.target.value.replace(/[^0-9.,]/g, "");
    });
    document.getElementById(`inv-btn-full-${idx}`).onclick = () => {
      const parsed = parseAmount(document.getElementById(`inv-val-${idx}`).value);
      if (parsed <= 0) return;
      confirmInvoiceFull(card.id, m, parsed);
    };

    const entradaInput = document.getElementById(`inv-entrada-${idx}`);
    const parcelaValorInput = document.getElementById(`inv-parcela-valor-${idx}`);
    const parcelasInput = document.getElementById(`inv-parcelas-${idx}`);
    const preview = document.getElementById(`inv-preview-${idx}`);
    const updatePreview = () => {
      const entrada = parseAmount(entradaInput.value);
      const parcelaValor = parseAmount(parcelaValorInput.value);
      const parcelas = Math.max(1, Number(parcelasInput.value) || 1);
      const totalParcelado = parcelaValor * parcelas;
      const totalPago = entrada + totalParcelado;
      const diff = totalPago - total;
      let diffText = "";
      if (parcelaValor > 0){
        diffText = diff > 0.005
          ? ` (${fmt(diff)} a mais que a fatura — provavelmente juros)`
          : diff < -0.005
            ? ` (${fmt(-diff)} a menos que a fatura)`
            : "";
      }
      preview.textContent = `Entrada de ${fmt(entrada)} + ${parcelas}x de ${fmt(parcelaValor)} = ${fmt(totalPago)} no total${diffText}.`;
    };
    entradaInput.addEventListener("input", (e) => { e.target.value = e.target.value.replace(/[^0-9.,]/g, ""); updatePreview(); });
    parcelaValorInput.addEventListener("input", (e) => { e.target.value = e.target.value.replace(/[^0-9.,]/g, ""); updatePreview(); });
    parcelasInput.addEventListener("input", updatePreview);
    updatePreview();

    document.getElementById(`inv-btn-parcel-${idx}`).onclick = () => {
      const entrada = parseAmount(entradaInput.value);
      const parcelaValor = parseAmount(parcelaValorInput.value);
      const parcelas = Math.max(1, Number(parcelasInput.value) || 1);
      if (entrada < 0 || parcelaValor <= 0) return;
      confirmInvoiceParcelado(card.id, m, entrada, parcelaValor, parcelas);
    };
  });
}

// ===================== ENTRY FORM =====================
function openEntryForm(existingEntry){
  const editing = !!existingEntry;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-header"><div class="sheet-title">${editing ? "Editar lançamento" : "Novo lançamento"}</div><button class="icon-btn" id="form-close">✕</button></div>
      <div class="segment">
        <button class="segment-btn" id="flow-expense">Gasto</button>
        <button class="segment-btn" id="flow-income">Renda</button>
        <button class="segment-btn" id="flow-investment">Investimento</button>
      </div>
      <div class="field"><div class="field-label">Descrição</div><input class="input" id="f-desc" placeholder="Ex: Mercado, Uber, Netflix..."></div>
      <div class="field"><div class="field-label">Valor</div><input class="input" id="f-amount" inputmode="decimal" placeholder="0,00"></div>
      <div class="field"><div class="field-label">Categoria</div><select class="input" id="f-category"></select></div>
      <div class="field" id="f-source-field"><div class="field-label">Onde saiu</div>
        <select class="input" id="f-source">${SOURCES.map(s=>`<option value="${s.id}">${s.label}</option>`).join("")}</select>
        <div class="card-hint" id="f-card-hint" style="display:none;">Vai entrar na fatura do mês seguinte e só sai do saldo nesse mês.</div>
      </div>
      <div class="field"><div class="field-label">Tipo</div>
        <div class="segment">
          <button class="segment-btn" id="type-single">Única</button>
          <button class="segment-btn" id="type-recurring">Fixa mensal</button>
          <button class="segment-btn" id="type-installment">Parcelada</button>
        </div>
        ${editing ? `<div class="card-hint">O tipo não pode ser alterado — exclua e crie um novo lançamento se precisar mudar.</div>` : ""}
      </div>
      <div class="field" id="f-installments-field" style="display:none;">
        <div class="field-label">Número de parcelas (valor informado é de cada parcela)</div>
        <input class="input" id="f-installments" type="number" min="2" value="2">
      </div>
      <div class="field"><div class="field-label" id="f-month-label">Mês do lançamento</div><input class="input" id="f-month" type="month" min="${APP_START_MONTH}" value="${month}"></div>
      <div class="field" id="f-endmonth-field" style="display:none;">
        <div class="field-label">Encerra em (opcional — deixe em branco se continua todo mês)</div>
        <input class="input" id="f-endmonth" type="month" min="${APP_START_MONTH}">
      </div>
      <button class="save-btn" id="f-save">${editing ? "Salvar alterações" : "Salvar lançamento"}</button>
    </div>
  `;
  document.body.appendChild(overlay);

  let state = { flow: existingEntry?.flow || "expense", type: existingEntry?.type || "single" };

  const catSelect = overlay.querySelector("#f-category");
  function fillCategories(selected){
    const cats = state.flow === "expense" ? EXPENSE_CATEGORIES : state.flow === "income" ? INCOME_CATEGORIES : INVESTMENT_CATEGORIES;
    catSelect.innerHTML = cats.map(c => `<option value="${c}" ${c===selected?"selected":""}>${c}</option>`).join("");
  }
  fillCategories(existingEntry?.category);

  function setFlow(flow, initial){
    state.flow = flow;
    overlay.querySelector("#flow-expense").style.cssText = flow==="expense" ? `background:${CORAL};color:#fff;border-color:${CORAL}` : "";
    overlay.querySelector("#flow-income").style.cssText = flow==="income" ? `background:${TEAL};color:#fff;border-color:${TEAL}` : "";
    overlay.querySelector("#flow-investment").style.cssText = flow==="investment" ? `background:${GOLD};color:#fff;border-color:${GOLD}` : "";
    overlay.querySelector("#f-source-field").style.display = flow==="expense" ? "block" : "none";
    overlay.querySelector("#f-desc").placeholder = flow==="expense" ? "Ex: Mercado, Uber, Netflix..." : flow==="income" ? "Ex: Salário, Freelance..." : "Ex: Aporte Tesouro, Compra de ações...";
    if (!initial) fillCategories();
    else fillCategories(existingEntry?.category);
  }
  overlay.querySelector("#flow-expense").onclick = () => setFlow("expense");
  overlay.querySelector("#flow-income").onclick = () => setFlow("income");
  overlay.querySelector("#flow-investment").onclick = () => setFlow("investment");

  function setType(type){
    state.type = type;
    ["single","recurring","installment"].forEach(t => {
      overlay.querySelector(`#type-${t}`).style.cssText = t===type ? `background:${INK};color:#fff;border-color:${INK}` : "";
    });
    overlay.querySelector("#f-installments-field").style.display = type==="installment" ? "block" : "none";
    overlay.querySelector("#f-endmonth-field").style.display = type==="recurring" ? "block" : "none";
    overlay.querySelector("#f-month-label").textContent = type==="single" ? "Mês do lançamento" : "Começa em";
  }
  if (editing){
    // tipo travado na edição — evita inconsistência (ex: virar parcelada sem parcelas já geradas)
    overlay.querySelectorAll("#type-single,#type-recurring,#type-installment").forEach(b => {
      b.disabled = true; b.style.opacity = "0.5"; b.style.cursor = "default";
    });
  } else {
    overlay.querySelector("#type-single").onclick = () => setType("single");
    overlay.querySelector("#type-recurring").onclick = () => setType("recurring");
    overlay.querySelector("#type-installment").onclick = () => setType("installment");
  }

  const sourceSelect = overlay.querySelector("#f-source");
  const cardHint = overlay.querySelector("#f-card-hint");
  sourceSelect.onchange = () => { cardHint.style.display = isCardSource(sourceSelect.value) ? "block" : "none"; };

  overlay.querySelector("#f-amount").addEventListener("input", (e) => {
    e.target.value = e.target.value.replace(/[^0-9.,]/g, "");
  });

  overlay.querySelector("#form-close").onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  // ---- pré-preenche se estiver editando ----
  setFlow(state.flow, true);
  setType(state.type);
  if (editing){
    overlay.querySelector("#f-desc").value = existingEntry.description;
    overlay.querySelector("#f-amount").value = String(existingEntry.amount).replace(".", ",");
    if (existingEntry.source) sourceSelect.value = existingEntry.source;
    cardHint.style.display = isCardSource(existingEntry.source) ? "block" : "none";
    overlay.querySelector("#f-month").value = existingEntry.startMonth;
    if (existingEntry.type === "installment") overlay.querySelector("#f-installments").value = existingEntry.installments;
    if (existingEntry.type === "recurring") overlay.querySelector("#f-endmonth").value = existingEntry.endMonth || "";
  }

  overlay.querySelector("#f-save").onclick = () => {
    const description = overlay.querySelector("#f-desc").value.trim();
    const amount = parseAmount(overlay.querySelector("#f-amount").value);
    if (!description || amount <= 0) return;
    const category = catSelect.value;
    const source = state.flow === "expense" ? sourceSelect.value : null;
    const startMonth = overlay.querySelector("#f-month").value || month;
    const installments = state.type === "installment" ? Number(overlay.querySelector("#f-installments").value) : undefined;
    const endMonth = state.type === "recurring" ? (overlay.querySelector("#f-endmonth").value || null) : null;

    if (editing){
      updateEntry(existingEntry.id, { flow: state.flow, description, category, source, amount, startMonth, installments, endMonth });
    } else {
      addEntry({ flow: state.flow, description, category, source, amount, type: state.type, startMonth, installments, endMonth });
    }
    overlay.remove();
  };
}
</script>
